<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    #answer { white-space: pre-wrap; margin-top: 1.5rem; padding: 1rem; background: #f4f6f8; border-radius: 6px; min-height: 3rem; }
    .blocked { border-left: 4px solid #c0392b; }
    .not_found { border-left: 4px solid #e0a800; }
    .answered { border-left: 4px solid #2e7d32; }
    ol { padding-left: 1.2rem; color: #444; }
  </style>
</head>
<body>
  <h1>Manual Assistant</h1>
  <p>Answers come only from the indexed manuals, with a source for every fact.</p>
  <form id="ask">
    <input id="q" maxlength="500" placeholder="e.g. What does alarm F-0021 mean?" required>
    <button>Ask</button>
  </form>
  <div id="answer"></div>
  <ol id="sources"></ol>
  <script>
    // All model output is inserted with textContent, never innerHTML:
    // an answer containing HTML or script is shown as text (OWASP LLM05).
    const form = document.getElementById('ask');
    const answer = document.getElementById('answer');
    const sources = document.getElementById('sources');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      answer.textContent = 'Searching…';
      answer.className = '';
      sources.replaceChildren();
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: document.getElementById('q').value }),
        });
        const data = await res.json();
        if (!res.ok) { answer.textContent = data.detail || res.statusText; return; }
        answer.textContent = data.text;
        answer.className = data.status;
        for (const s of data.sources) {
          const li = document.createElement('li');
          li.textContent = `${s.file}${s.location ? ' — ' + s.location : ''} (score ${s.score})`;
          sources.appendChild(li);
        }
      } catch (err) {
        answer.textContent = 'Request failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
